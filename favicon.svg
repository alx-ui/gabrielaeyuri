<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente Terracota quente e sofisticado -->
    <linearGradient id="terracottaBadge" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#C96A4C" />
      <stop offset="50%" stop-color="#B35434" />
      <stop offset="100%" stop-color="#883318" />
    </linearGradient>

    <!-- Brilho superior sutil para dar efeito de selo artesanal -->
    <linearGradient id="innerGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Sombra suave para os caracteres -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#4A180B" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Circular do Selo -->
  <circle cx="32" cy="32" r="30" fill="url(#terracottaBadge)" />

  <!-- Camada de relevo/brilho no topo -->
  <circle cx="32" cy="32" r="30" fill="url(#innerGlow)" />

  <!-- Borda externa suave -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#FAF7F2" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- Borda tracejada artesanal idêntica ao selo do Hero -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#FAF7F2" stroke-width="0.9" stroke-dasharray="2.8 2.2" stroke-opacity="0.75" />

  <!-- Monograma G & Y -->
  <g filter="url(#textGlow)">
    <text 
      x="32" 
      y="38.5" 
      text-anchor="middle" 
      font-family="Georgia, 'Cormorant Garamond', 'Didot', 'Baskerville', serif" 
      font-size="19" 
      font-weight="700" 
      fill="#FAF7F2" 
      letter-spacing="0.5"
    >
      G<tspan font-family="'Brush Script MT', 'Baskerville', 'Georgia', cursive, serif" font-style="italic" font-weight="normal" font-size="15" fill="#FCE9E2" dx="1.5" dy="-1.5">&amp;</tspan><tspan dx="1.5">Y</tspan>
    </text>
  </g>

  <!-- Pequeno ponto clássico de acabamento na base -->
  <circle cx="32" cy="46.5" r="1" fill="#FAF7F2" fill-opacity="0.7" />
</svg>
